version: "2"
services:
  db:
    container_name: hermes_db
    image: hermes/db:1.0
    build:
      context: ..
      dockerfile: deploy/db/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: h2o_db_password
  app:
    container_name: hermes_ui
    image: hermes/app:1.0
    build:
      context: ..
      dockerfile: deploy/app_server/Dockerfile
    privileged: true
    links:
      - db
    expose:
      - 18080
    ports:
      - "18080:8080"
